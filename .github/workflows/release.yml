name: Release

# Every push to `production` builds all platforms and publishes a GitHub
# release tagged v<version> (version read from src-tauri/tauri.conf.json),
# including the signed updater artifacts + latest.json manifest that the
# in-app updater consumes. Tests are not repeated here: CI runs them on every
# push to main, and production only ever receives main.

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
            targets: aarch64-apple-darwin
          - name: Linux (x64)
            platform: ubuntu-22.04
            args: ""
            targets: ""
          - name: Windows (x64)
            platform: windows-latest
            args: ""
            targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      # Defender scans every file rustc writes; on hosted Windows runners that
      # is a large share of the build. The runner is thrown away afterwards.
      - name: Disable Windows Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Data Based v__VERSION__"
          releaseBody: |
            ## Data Based - the free, no-nonsense MongoDB and PostgreSQL client

            Download the build for your platform below. Existing installs
            update themselves automatically.

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `*_aarch64.dmg` |
            | Windows | `*_x64-setup.exe` / `*.msi` |
            | Linux | `*.AppImage` / `*.deb` / `*.rpm` |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
